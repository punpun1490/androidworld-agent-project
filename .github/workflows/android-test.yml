name: AndroidWorld Benchmark Test

on:
  workflow_dispatch:

jobs:
  androidworld-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install AndroidWorld
        run: |
          git clone --depth 1 https://github.com/google-research/android_world.git
          cd android_world
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -c "import android_world; print('ANDROIDWORLD IMPORT OK')"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare benchmark script
        run: |
          mkdir -p "$GITHUB_WORKSPACE/results"
          echo "Benchmark setup started" > "$GITHUB_WORKSPACE/results/setup-status.txt"
          cat > "$GITHUB_WORKSPACE/benchmark-smoke.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          ADB_BIN="$(command -v adb)"
          if [[ -z "$ADB_BIN" ]]; then
            echo "ERROR: adb not on PATH"
            exit 1
          fi
          mkdir -p "$HOME/Android/Sdk/platform-tools"
          if [[ "$ADB_BIN" != "$HOME/Android/Sdk/platform-tools/adb" ]]; then
            ln -sfn "$ADB_BIN" "$HOME/Android/Sdk/platform-tools/adb"
          fi

          echo "Connected devices:"
          adb devices
          echo "Emulator boot state: $(adb shell getprop sys.boot_completed)"

          cd "$GITHUB_WORKSPACE/android_world"
          echo "Starting SystemWifiTurnOn benchmark (random agent)..."
          if ! python -u run.py \
            --suite_family=android_world \
            --agent_name=random_agent \
            --tasks=SystemWifiTurnOn \
            --perform_emulator_setup \
            --adb_path="$ADB_BIN" \
            --output_path="$GITHUB_WORKSPACE/results" \
            2>&1 | tee "$GITHUB_WORKSPACE/results/benchmark.log"; then
            echo "ERROR: AndroidWorld benchmark command failed"
            exit 1
          fi

          if ! grep -q "Running task" "$GITHUB_WORKSPACE/results/benchmark.log"; then
            echo "ERROR: No benchmark task execution was observed"
            exit 1
          fi
          if ! grep -Eq "Task (Successful|Failed)" "$GITHUB_WORKSPACE/results/benchmark.log"; then
            echo "ERROR: No benchmark task result was observed"
            exit 1
          fi
          if grep -q "SKIPPING" "$GITHUB_WORKSPACE/results/benchmark.log"; then
            echo "ERROR: AndroidWorld skipped the task"
            exit 1
          fi

          echo "ANDROIDWORLD SMOKE TEST PASSED"
          BASH
          chmod +x "$GITHUB_WORKSPACE/benchmark-smoke.sh"

      - name: Run AndroidWorld task
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: AndroidWorldAvd
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -grpc 8554
          script: bash "$GITHUB_WORKSPACE/benchmark-smoke.sh"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: androidworld-smoke-results
          path: results/
          if-no-files-found: warn
